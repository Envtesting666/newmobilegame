<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1C1C1E" />
    <meta name="description" content="AI-Powered Football Management Simulation with Dynamic Content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Football Manager AI - Gemini Powered</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />

    <!-- Preconnect to Gemini API -->
    <link rel="preconnect" href="https://generativelanguage.googleapis.com" />

    <style>
      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1C1C1E;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
      }

      #loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #2C2C2E;
        border-top-color: #0A84FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      #loading-text {
        margin-top: 20px;
        color: rgba(235, 235, 245, 0.6);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 14px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Hide loading once React loads */
      .loaded #loading {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to run Football Manager AI.</p>
      </div>
    </noscript>

    <!-- Loading Screen -->
    <div id="loading">
      <div id="loading-spinner"></div>
      <div id="loading-text">Loading Football Manager AI...</div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <script>
      // Remove loading screen when React is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 500);
      });
    </script>
  </body>
</html>
